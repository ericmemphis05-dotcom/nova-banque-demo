<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banque Nova</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  color: #172554;
}
header {
  background: #102b55;
  color: white;
  padding: 25px;
  text-align: center;
}
main {
  padding: 25px;
  max-width: 600px;
  margin: auto;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  margin-top: 20px;
  box-shadow: 0 3px 12px #0001;
}
button {
  background: #1675d1;
  color: white;
  border: 0;
  padding: 13px 20px;
  border-radius: 8px;
  font-size: 16px;
}
</style>
</head>
<body>
<header>
  <h1>BANQUE NOVA</h1>
  <p>Votre banque, votre avenir</p>
</header>
<main>
  <div class="card">
    <h2>Bienvenue chez Nova</h2>
    <p>Découvrez une nouvelle expérience bancaire.</p>
    <button onclick="alert('Bienvenue chez Banque Nova !')">
      Découvrir
    </button>
  </div>
  <div class="card">
    <h2>Nos services</h2>
    <p>💳 Cartes bancaires</p>
    <p>💰 Épargne</p>
    <p>📱 Banque en ligne</p>
    <p>🤝 Assistance client</p>
  </div>
</main>
</body>
</html>
